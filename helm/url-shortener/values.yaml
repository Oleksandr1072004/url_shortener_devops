# Default values for url-shortener
replicaCount: 2

image:
  repository: api-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30080

ingress:
  enabled: false
  host: url-shortener.local
  annotations: {}

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

config:
  baseUrl: "http://url-shortener.local"
  codeLength: "6"

secret:
  databaseUrl: "postgresql://shortener:secret@db:5432/shortener_db"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5