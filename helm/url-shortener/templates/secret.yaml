apiVersion: v1
kind: Secret
metadata:
  name: {{ include "url-shortener.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
type: Opaque
data:
  # Значення має бути base64-encoded. Використовуйте stringData для сирих рядків
  DATABASE_URL: {{ .Values.secret.databaseUrl | b64enc | quote }}