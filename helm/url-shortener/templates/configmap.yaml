apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
data:
  BASE_URL: {{ .Values.config.baseUrl | quote }}
  CODE_LENGTH: {{ .Values.config.codeLength | quote }}